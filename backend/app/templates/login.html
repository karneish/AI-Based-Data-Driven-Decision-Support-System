{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="wrap" style="padding: 28px 0 0;">
  <a class="btn btn-ghost btn-sm" href="/" style="padding-left:0">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    Back to home
  </a>
</div>

<div class="flex-center" style="min-height: calc(100vh - 120px); padding: 24px 0 60px;">
  <div class="glass card anim-up" style="width:min(420px, 94vw); border-color: rgba(51,164,252,0.22);">
    <div class="flex-center mb-4">
      <div class="logo-mark" style="width:56px;height:56px;font-size:1.4rem">D</div>
    </div>
    <h1 class="title center mb-1">Sign In</h1>
    <p class="center muted small mb-5">DSS-MIP · Academic Decision Support</p>

    {% if error %}
    <div class="alert alert-red mb-4">{{ error }}</div>
    {% endif %}
    {% if msg %}
    <div class="alert alert-green mb-4">{{ msg }}</div>
    {% endif %}

    <form method="post" action="/login" autocomplete="off">
      <div class="field">
        <label class="label" for="username">Username</label>
        <input class="input" id="username" name="username" placeholder="e.g. karneish" value="{{ username or '' }}" required autofocus>
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <div style="position:relative">
          <input class="input" id="password" name="password" type="password" placeholder="••••••••" style="padding-right:46px" required>
          <button type="button" class="btn btn-ghost btn-sm" onclick="togglePass()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px" aria-label="Toggle password">
            <svg id="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="padding:14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z"/><path d="m9 12 2 2 4-4"/></svg>
        Sign In
      </button>
    </form>

    <div class="flex items-center gap-3 my-5">
      <div class="divider" style="flex:1;margin:0"></div>
      <span class="tiny faint mono">quick demo</span>
      <div class="divider" style="flex:1;margin:0"></div>
    </div>

    <div class="flex-col gap-2">
      <button type="button" class="btn btn-secondary btn-sm flex-between" style="width:100%" onclick="quickFill('karneish','pass123')">
        <span class="mono" style="color:var(--brand)">karneish</span>
        <span class="tiny faint">Student</span>
      </button>
      <button type="button" class="btn btn-secondary btn-sm flex-between" style="width:100%" onclick="quickFill('admin','admin123')">
        <span class="mono" style="color:var(--brand)">admin</span>
        <span class="tiny faint">Advisor</span>
      </button>
      <button type="button" class="btn btn-secondary btn-sm flex-between" style="width:100%" onclick="quickFill('student1','pass123')">
        <span class="mono" style="color:var(--brand)">student1</span>
        <span class="tiny faint">Arjun Sharma</span>
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  function quickFill(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
  }
  function togglePass() {
    const el = document.getElementById('password');
    el.type = el.type === 'password' ? 'text' : 'password';
  }
</script>
{% endblock %}
